version: "2"

run:
  tests: true

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - revive
    - misspell

  settings:
    revive:
      severity: warning
    misspell:
      locale: US

  exclusions:
    paths:
      - docs
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
